name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore /home/runner/work/ABF-GP/ABF-GP/WebsiteComparer.sln
      - run: dotnet build /home/runner/work/ABF-GP/ABF-GP/WebsiteComparer.sln --no-restore
      - run: dotnet test /home/runner/work/ABF-GP/ABF-GP/WebsiteComparer.sln --no-build --verbosity normal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/**'
